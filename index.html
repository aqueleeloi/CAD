<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESSA - CAD & Quotes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; padding: 40px; display: flex; justify-content: center; }
        
        .sheet-container {
            width: 1100px;
            height: 750px;
            background: white;
            padding: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 15px;
            height: 100%;
        }

        .drawing-area {
            border: 3px solid #888;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }

        .grid-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            pointer-events: none;
            z-index: 1;
        }
        .grid-lines div { border: 1px solid #e5e7eb; }

        .quadrant-labels {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        .label-tl { position: absolute; top: 15px; left: 15px; font-weight: 700; font-size: 11px; color: #333; }
        .label-tr { position: absolute; top: 15px; right: 15px; font-weight: 700; font-size: 11px; color: #333; }
        .label-bl { position: absolute; top: 50%; left: 15px; font-weight: 700; font-size: 11px; color: #333; transform: translateY(-50%); margin-top: 15px;}
        .label-br { position: absolute; top: 50%; right: 15px; font-weight: 700; font-size: 11px; color: #333; transform: translateY(-50%); margin-top: 15px;}

        .upload-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            cursor: pointer;
            background: rgba(255,255,255,0.8);
            transition: background 0.3s;
        }
        
        .upload-overlay:hover { background: rgba(243, 244, 246, 0.9); }

        .upload-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #4b5563;
        }

        .upload-icon {
            width: 40px;
            height: 40px;
            border: 2px solid #4b5563;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 300;
        }

        .upload-text {
            font-weight: 700;
            font-size: 14px;
            max-width: 250px;
            line-height: 1.2;
            text-align: center;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-box {
            padding-bottom: 20px;
        }

        .logo-box .brand { font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
        .logo-box .sub { font-size: 8px; font-weight: 700; letter-spacing: 3px; color: #666; margin-top: 2px; }

        .info-section {
            border-top: 1px solid #e5e7eb;
            padding: 15px 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-weight: 700;
            font-size: 11px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .editable-field { outline: none; display: inline-block; min-width: 20px; border-bottom: 1px dotted transparent;}
        .editable-field:hover, .editable-field:focus { background: #f3f4f6; border-bottom: 1px dotted #9ca3af;}
        [contenteditable]:empty:before { content: attr(placeholder); color: #9ca3af; }

        .tech-sheet { font-size: 10px; display: grid; grid-template-columns: 50px 1fr; gap: 4px; align-items: baseline;}
        .tech-label { font-weight: 700; color: #666; }

        .btn-add {
            font-size: 14px; color: #9ca3af; cursor: pointer; transition: color 0.2s;
        }
        .btn-add:hover { color: #333; }

        .hidden { display: none !important; }
        
        #result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 15;
            position: relative;
            background: white;
        }

        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="sheet-container">
        <div class="main-content">
            
            <!-- DRAWING AREA -->
            <div class="drawing-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="grid-lines">
                    <div></div><div></div><div></div><div></div>
                </div>

                <div class="quadrant-labels" id="labels">
                    <div class="label-tl">VISTA REALISTA ISOMETRICA</div>
                    <div class="label-tr">VISTA DE CIMA</div>
                    <div class="label-bl">VISTA DE LADO</div>
                    <div class="label-br">VISTA DE FRENTE</div>
                </div>

                <div class="upload-overlay" id="upload-overlay">
                    <div class="upload-content" id="upload-content">
                        <div class="upload-icon">+</div>
                        <div class="upload-text">CLIQUE PARA UPLOAD DA FOTO</div>
                        <button onclick="event.stopPropagation(); testConnection()" class="text-[10px] text-blue-500 underline mt-4">TESTAR LIGAÇÃO AO JARVAS</button>
                    </div>
                </div>

                <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleUpload(this)">
                <img id="result-image" class="hidden">
            </div>

            <!-- SIDEBAR -->
            <div class="sidebar">
                <div class="logo-box">
                    <div class="brand">PESSA</div>
                    <div class="sub">ATELIER CRIATIVO</div>
                </div>

                <div class="info-section">
                    <div class="section-title">FICHA TÉCNICA</div>
                    <div class="tech-sheet">
                        <span class="tech-label">PROJ:</span>
                        <span class="editable-field font-bold" contenteditable="true" placeholder="Nome do Projeto"></span>
                        
                        <span class="tech-label">REF:</span>
                        <span class="editable-field" contenteditable="true" placeholder="0001"></span>
                        
                        <span class="tech-label">DATA:</span>
                        <span class="editable-field" contenteditable="true" placeholder="DD/MM/AAAA"></span>
                        
                        <span class="tech-label">ESC:</span>
                        <span class="editable-field" contenteditable="true">1:20 (1.80m)</span>
                    </div>
                </div>

                <div class="info-section flex-1">
                    <div class="section-title">
                        DETALHES CONSTRUTIVOS
                        <span class="btn-add" onclick="addDetail()">+</span>
                    </div>
                    <div id="details-list" class="text-[10px] space-y-2" contenteditable="true" placeholder="Clique para adicionar detalhes...">
                    </div>
                </div>

                <div class="info-section flex-1">
                    <div class="section-title">
                        LISTA DE MATERIAIS
                        <span class="btn-add" onclick="addMaterial()">+</span>
                    </div>
                    <div id="materials-list" class="text-[10px] space-y-2">
                    </div>
                </div>

                <div class="info-section pb-0 border-b-0">
                    <button class="w-full bg-black text-white py-3 text-xs font-bold hover:bg-gray-800 transition" onclick="window.print()">EXPORTAR PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function testConnection() {
            const status = document.createElement('div');
            status.className = "text-[10px] mt-2 font-mono text-center";
            document.getElementById('upload-content').appendChild(status);
            
            status.innerText = "A testar 127.0.0.1:18790...";
            try {
                const r = await fetch('http://127.0.0.1:18790/ping');
                if(r.ok) { status.innerText = "✅ Ligado ao Jarvas!"; return; }
            } catch(e) {}
            
            status.innerText = "A testar localhost:18790...";
            try {
                const r = await fetch('http://localhost:18790/ping');
                if(r.ok) { status.innerText = "✅ Ligado ao Jarvas!"; return; }
            } catch(e) {}

            status.innerHTML = "❌ Erro. Garante que permitiste 'Conteúdo Inseguro' no cadeado do browser.";
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const content = document.getElementById('upload-content');
                const overlay = document.getElementById('upload-overlay');
                const resultImg = document.getElementById('result-image');

                content.innerHTML = `
                    <div class="flex flex-col items-center gap-4">
                        <div class="loading-spinner"></div>
                        <div class="font-bold text-sm text-center">A analisar foto e a usar AI para<br>gerar vistas e medidas...</div>
                    </div>
                `;

                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Image = e.target.result;
                    const promptText = "Converter foto em desenho técnico CAD 2x2 com cotas em centímetros baseadas na pessoa de 1.80m.";

                    const endpoints = ['http://127.0.0.1:18790/generate', 'http://localhost:18790/generate'];
                    let success = false;

                    for(let url of endpoints) {
                        try {
                            const response = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image: base64Image, prompt: promptText })
                            });
                            
                            if(response.ok) {
                                const data = await response.json();
                                overlay.classList.add('hidden');
                                resultImg.src = data.imageUrl; 
                                resultImg.classList.remove('hidden');
                                success = true;
                                break;
                            }
                        } catch(err) {}
                    }

                    if(!success) {
                        content.innerHTML = `
                            <div class="flex flex-col items-center gap-4 text-red-600 p-4">
                                <div class="text-2xl">⚠️</div>
                                <div class="font-bold text-sm text-center text-red-600">ERRO NA LIGAÇÃO À AI.</div>
                                <div class="text-[10px] text-gray-500 text-center">Usa: http://localhost:8080</div>
                                <button onclick="location.reload()" class="text-xs underline text-gray-500">Tentar novamente</button>
                            </div>
                        `;
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function addMaterial() {
            const list = document.getElementById('materials-list');
            const item = document.createElement('div');
            item.className = "flex gap-2 items-start group";
            item.innerHTML = `
                <span class="text-gray-400 cursor-pointer hover:text-red-500" onclick="this.parentElement.remove()">×</span>
                <span class="editable-field flex-1" contenteditable="true" placeholder="Descrição do material..."></span>
            `;
            list.appendChild(item);
        }
    </script>
</body>
</html>
