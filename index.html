<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESSA - CAD & Quotes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; padding: 40px; display: flex; justify-content: center; }
        
        .sheet-container {
            width: 1100px;
            height: 750px;
            background: white;
            padding: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 15px;
            height: 100%;
        }

        .drawing-area {
            border: 3px solid #888;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }

        /* 2x2 Grid Lines behind the overlay */
        .grid-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            pointer-events: none;
            z-index: 1;
        }
        .grid-lines div { border: 1px solid #e5e7eb; }

        .quadrant-labels {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        .label-tl { position: absolute; top: 15px; left: 15px; font-weight: 700; font-size: 11px; color: #333; }
        .label-tr { position: absolute; top: 15px; right: 15px; font-weight: 700; font-size: 11px; color: #333; }
        .label-bl { position: absolute; top: 50%; left: 15px; font-weight: 700; font-size: 11px; color: #333; transform: translateY(-50%); margin-top: 15px;}
        .label-br { position: absolute; top: 50%; right: 15px; font-weight: 700; font-size: 11px; color: #333; transform: translateY(-50%); margin-top: 15px;}

        .upload-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            cursor: pointer;
            background: rgba(255,255,255,0.8);
            transition: background 0.3s;
        }
        
        .upload-overlay:hover { background: rgba(243, 244, 246, 0.9); }

        .upload-content {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #4b5563;
        }

        .upload-icon {
            width: 40px;
            height: 40px;
            border: 2px solid #4b5563;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 300;
        }

        .upload-text {
            font-weight: 700;
            font-size: 14px;
            max-width: 250px;
            line-height: 1.2;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .logo-box {
            padding-bottom: 20px;
        }

        .logo-box .brand { font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
        .logo-box .sub { font-size: 8px; font-weight: 700; letter-spacing: 3px; color: #666; margin-top: 2px; }

        .info-section {
            border-top: 1px solid #e5e7eb;
            padding: 15px 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-weight: 700;
            font-size: 11px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .editable-field { outline: none; display: inline-block; min-width: 20px; border-bottom: 1px dotted transparent;}
        .editable-field:hover, .editable-field:focus { background: #f3f4f6; border-bottom: 1px dotted #9ca3af;}
        [contenteditable]:empty:before { content: attr(placeholder); color: #9ca3af; }

        .tech-sheet { font-size: 10px; display: grid; grid-template-columns: 50px 1fr; gap: 4px; align-items: baseline;}
        .tech-label { font-weight: 700; color: #666; }

        .btn-add {
            font-size: 14px; color: #9ca3af; cursor: pointer; transition: color 0.2s;
        }
        .btn-add:hover { color: #333; }

        .hidden { display: none !important; }
        
        #result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 15;
            position: relative;
            background: white;
        }

        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="sheet-container">
        <div class="main-content">
            
            <!-- DRAWING AREA -->
            <div class="drawing-area" id="drop-zone">
                <div class="grid-lines">
                    <div></div><div></div><div></div><div></div>
                </div>

                <div class="quadrant-labels" id="labels">
                    <div class="label-tl">VISTA REALISTA ISOMETRICA</div>
                    <div class="label-tr">VISTA DE CIMA</div>
                    <div class="label-bl">VISTA DE LADO</div>
                    <div class="label-br">VISTA DE FRENTE</div>
                </div>

                <div class="upload-overlay" id="upload-overlay" onclick="document.getElementById('file-input').click()">
                    <div class="upload-content" id="upload-content">
                        <div class="upload-icon">+</div>
                        <div class="upload-text">UPLOAD E ANALISE AI GOOGLE PARA CRIAR AS VISTAS E MEDIDAS</div>
                    </div>
                </div>

                <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleUpload(this)">
                
                <img id="result-image" class="hidden">
            </div>

            <!-- SIDEBAR -->
            <div class="sidebar">
                <div class="logo-box">
                    <div class="brand">PESSA</div>
                    <div class="sub">ATELIER CRIATIVO</div>
                </div>

                <div class="info-section">
                    <div class="section-title">FICHA TÉCNICA</div>
                    <div class="tech-sheet">
                        <span class="tech-label">PROJ:</span>
                        <span class="editable-field font-bold" contenteditable="true" placeholder="Nome do Projeto"></span>
                        
                        <span class="tech-label">REF:</span>
                        <span class="editable-field" contenteditable="true" placeholder="0001"></span>
                        
                        <span class="tech-label">DATA:</span>
                        <span class="editable-field" contenteditable="true" placeholder="DD/MM/AAAA"></span>
                        
                        <span class="tech-label">ESC:</span>
                        <span class="editable-field" contenteditable="true">1:20 (1.80m)</span>
                    </div>
                </div>

                <div class="info-section flex-1">
                    <div class="section-title">
                        DETALHES CONSTRUTIVOS
                        <span class="btn-add" onclick="addDetail()">+</span>
                    </div>
                    <div id="details-list" class="text-[10px] space-y-2" contenteditable="true" placeholder="Clique para adicionar detalhes da estrutura, soldaduras, etc...">
                    </div>
                </div>

                <div class="info-section flex-1">
                    <div class="section-title">
                        LISTA DE MATERIAIS
                        <span class="btn-add" onclick="addMaterial()">+</span>
                    </div>
                    <div id="materials-list" class="text-[10px] space-y-2">
                        <div class="flex gap-2 items-start group">
                            <span class="text-gray-400 cursor-pointer hover:text-red-500" onclick="this.parentElement.remove()">×</span>
                            <span class="editable-field flex-1" contenteditable="true" placeholder="Descrição do material..."></span>
                        </div>
                    </div>
                </div>

                <div class="info-section pb-0 border-b-0">
                    <button class="w-full bg-black text-white py-3 text-xs font-bold hover:bg-gray-800 transition" onclick="window.print()">EXPORTAR PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const content = document.getElementById('upload-content');
                const overlay = document.getElementById('upload-overlay');
                const resultImg = document.getElementById('result-image');

                // Mostrar Loading
                content.innerHTML = `
                    <div class="flex flex-col items-center gap-4">
                        <div class="loading-spinner"></div>
                        <div class="font-bold text-sm text-center">A analisar foto e a usar AI para<br>gerar vistas e medidas...</div>
                    </div>
                `;

                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Image = e.target.result;
                    const promptText = `Age como um engenheiro e designer técnico de elite. 
Objetivo: Converter a FOTO ANEXADA (que pode conter esculturas, mobiliário, equipamentos ou estruturas) num conjunto completo de desenhos técnicos ortográficos (Blueprints/CAD).

ESTRUTURA DA RESPOSTA:
Deves gerar uma única imagem composta num layout de grade 2x2 exato:
1. Quadrante Superior Esquerdo (VISTA SUPERIOR): Planta detalhada com linhas de cota (centímetros).
2. Quadrante Superior Direito (VISTA ISOMÉTRICA): Representação 3D fotorrealista do objeto da foto original, mantendo fielmente a sua forma, cores e texturas.
3. Quadrante Inferior Esquerdo (CORTE LATERAL/DETALHE): Vista de perfil ou corte técnico mostrando a estrutura interna ou espessuras.
4. Quadrante Inferior Direito (VISTA FRONTAL): Elevação frontal com cotas de altura e largura totais.

REGRAS CRÍTICAS:
- FIDELIDADE: O desenho técnico tem de ser EXATAMENTE do objeto na foto (ex: se forem coelhos e ovos, desenha coelhos e ovos; se for um tanque, desenha um tanque). Não inventes estruturas metálicas genéricas.
- ESCALA: Usa a pessoa de 1.80m (ou referência humana) na foto para calcular todas as dimensões reais em centímetros.
- ESTILO: Desenho estilo CAD limpo, fundo branco, linhas pretas nítidas, texto legível.
- SEM TEXTO EXTRA: Apenas as etiquetas das vistas ('VISTA SUPERIOR', 'VISTA FRONTAL', etc.).

CRIA A IMAGEM AGORA BASEADA NA FOTO FORNECIDA.`;

                    try {
                        const response = await fetch('http://127.0.0.1:18789/api/agent/prompt', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer beea43f799c784b449b7ea467b9a8919e0b7f736ce94ea54'
                            },
                            body: JSON.stringify({
                                image: base64Image,
                                prompt: promptText
                            })
                        });
                        
                        if(response.ok) {
                            const data = await response.json();
                            overlay.classList.add('hidden');
                            resultImg.src = data.imageUrl; 
                            resultImg.classList.remove('hidden');
                        } else {
                            throw new Error("Erro na geração");
                        }
                    } catch(err) {
                        content.innerHTML = `
                            <div class="flex flex-col items-center gap-4 text-red-600">
                                <div class="text-2xl">⚠️</div>
                                <div class="font-bold text-sm text-center">ERRO NA LIGAÇÃO À AI.<br>Verifica se o OpenClaw está a correr.</div>
                                <button onclick="location.reload()" class="text-xs underline text-gray-500">Tentar novamente</button>
                            </div>
                        `;
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function addMaterial() {
            const list = document.getElementById('materials-list');
            const item = document.createElement('div');
            item.className = "flex gap-2 items-start group";
            item.innerHTML = `
                <span class="text-gray-400 cursor-pointer hover:text-red-500" onclick="this.parentElement.remove()">×</span>
                <span class="editable-field flex-1" contenteditable="true" placeholder="Descrição do material..."></span>
            `;
            list.appendChild(item);
            item.querySelector('.editable-field').focus();
        }
    </script>
</body>
</html>
